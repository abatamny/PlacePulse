[project]
name = "placepulse"
version = "0.1.0"
description = "PlacePulse API and bootstrap services"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic==1.18.5",
  "argon2-cffi==25.1.0",
  "asyncpg==0.31.0",
  "email-validator==2.3.0",
  "fastapi==0.141.1",
  "geoalchemy2==0.20.0",
  "pydantic-settings==2.12.0",
  "redis==7.4.1",
  "sqlalchemy==2.0.51",
  "uvicorn==0.52.3",
  "websockets==17.0.1",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "jsonschema==4.25.1",
  "mypy==1.19.1",
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
  "ruff==0.15.1",
]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/placepulse"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires the Compose PostgreSQL/PostGIS and Redis services",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "S", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105"]
"migrations/**/*.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["placepulse"]

[[tool.mypy.overrides]]
module = ["geoalchemy2.*"]
ignore_missing_imports = true
